services:
  - type: web
    name: fanvue-academy-invite-bot
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        value: "1427337798104383694"
      - key: DATA_DIR
        value: /var/data
      - key: TIME_ZONE
        value: Europe/London
      - key: POLL_MS
        value: "15000"
      - key: INVITES_CHANNEL_NAME
        value: "🎁｜invites"
      - key: LANDING_CHANNEL_QUERY
        value: join
      - key: PORT
        value: "10000"
    disk:
      name: invite-bot-data
      mountPath: /var/data
      sizeGB: 1
