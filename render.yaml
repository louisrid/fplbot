services:
  - type: web
    name: fanvue-academy-invite-bot
    runtime: node
    plan: starter
    buildCommand: sh rebuild-source.sh && npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        value: "1427337798104383694"
      - key: NODE_VERSION
        value: "24.17.0"
      - key: AUTO_SETUP
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: "10000"
    disk:
      name: invite-bot-data
      mountPath: /var/data
      sizeGB: 1
